# Client Working Memory — First Heartland Bank

signals:
  business:
    - text: "First Heartland announced Q1 2026 net interest margin compression of 18bp, attributing part of the pressure to deposit product competitiveness vs. fintech alternatives"
      source: "Q1 2026 Earnings Call Transcript"
      date: "2026-04-15"
      importance: "High"
      relevance: "Creates urgency around digital product velocity — AI-powered personalization and faster deposit product iteration are directly relevant"
      voice: "researcher"

    - text: "Board approved $47M technology investment program for FY2026, with cloud modernization and AI readiness as stated priorities"
      source: "FY2025 Annual Report — Board Letter"
      date: "2026-02-28"
      importance: "High"
      relevance: "Budget is committed. Conversation is about sequencing and execution, not investment approval."
      voice: "researcher"

    - text: "Temenos T24 core banking contract expires Q2 2027. Renewal or replacement decision must be made by Q4 2026."
      source: "Marcus Webb — direct conversation — 2026-03-08"
      date: "2026-03-08"
      importance: "High"
      relevance: "Forcing function for the entire architecture discussion. Every cloud and AI use case is contingent on this decision."
      voice: "seller"

  technical:
    - text: "Current state: 162 point-to-point integrations between T24 and surrounding systems. Prior cloud migration attempts (2022, 2024) failed because workloads could not be lifted without breaking integration dependencies"
      source: "Marcus Webb — technical deep dive session — 2026-03-22"
      date: "2026-03-22"
      importance: "High"
      relevance: "Central technical constraint. No meaningful cloud migration or AI at scale possible without resolving this integration architecture first."
      voice: "seller"

    - text: "OCC Bulletin 2026-13 introduces new model risk management requirements for AI systems in lending decisions, effective Q1 2027"
      source: "OCC.gov — published April 2026"
      date: "2026-04-08"
      importance: "High"
      relevance: "Changes compliance framing for any lending AI use case. Governance infrastructure needs to be in place before Q1 2027."
      voice: "researcher"

  industry:
    - text: "60% of North American regional banks with assets $1B–$10B have moved 30%+ of non-core workloads to cloud as of 2025 (IDC Banking Cloud Adoption Report)"
      source: "IDC Banking Cloud Adoption Report 2025"
      date: "2026-01-20"
      importance: "Medium"
      relevance: "First Heartland is behind the peer benchmark at 12% workload migration."
      voice: "researcher"

  timing:
    - text: "Annual technology budget planning cycle begins September 2026. Any major program requiring FY2027 investment must be positioned by August 2026."
      source: "Sarah Chen — session 2026-01-15"
      date: "2026-01-15"
      importance: "High"
      relevance: "Hard deadline for positioning architecture modernization as a multi-year program."
      voice: "seller"

